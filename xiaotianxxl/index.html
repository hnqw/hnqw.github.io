<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍬 小甜消消乐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'ZCOOL KuaiLe', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6f0 0%, #ffd6e7 100%);
            min-height: 100vh;
        }

        /* 甜品格子基础样式 */
        .cell {
            @apply bg-white rounded-xl shadow-md flex items-center justify-center cursor-pointer transition-all duration-300 hover:scale-105;
            font-size: 28px;
            position: relative;
        }

        /* 选中高亮 */
        .cell.active {
            @apply border-2 border-pink-400 bg-pink-50 scale-105;
        }

        /* 消除动画（核心修复） */
        .cell-clear {
            animation: clearAnim 0.5s ease-in-out forwards;
        }

        @keyframes clearAnim {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* 下落动画 */
        .cell-drop {
            animation: dropAnim 0.3s ease-in-out;
        }

        @keyframes dropAnim {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* 提示闪烁动画 */
        .cell-hint {
            animation: hintAnim 0.8s infinite alternate;
            @apply border-yellow-400 border-2;
        }

        @keyframes hintAnim {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* 棋盘布局 */
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
        }

        /* 规则卡片 */
        .rule-card {
            @apply bg-white/90 rounded-xl p-3 text-pink-600 text-sm mb-4 shadow-sm max-w-md w-full text-center;
        }
    </style>
</head>
<body class="flex flex-col items-center py-6 px-4">
    <!-- 游戏标题 -->
    <div class="text-center mb-4">
        <h1 class="text-4xl font-bold text-pink-500 drop-shadow-md mb-2">🍰 小甜消消乐 🍬</h1>
        <p class="text-pink-600 text-lg">甜品三消小游戏</p>
    </div>

    <!-- 游戏规则（明确展示） -->
    <div class="rule-card">
        <p class="font-bold">📜 游戏规则</p>
        <p>1. 点击<strong>相邻</strong>两个甜品互换位置</p>
        <p>2. 横向/纵向<strong>凑3个及以上</strong>相同甜品即可消除</p>
        <p>3. 消除后甜品自动下落，连锁消除得分更高</p>
    </div>

    <!-- 信息栏 -->
    <div class="w-full max-w-md bg-white/80 rounded-xl p-4 mb-5 flex justify-between items-center shadow-sm">
        <div class="text-pink-600">
            <span class="font-bold">时间：</span>
            <span id="time" class="text-red-500 text-xl">90</span>s
        </div>
        <div class="text-pink-600">
            <span class="font-bold">分数：</span>
            <span id="score" class="text-pink-500 text-xl">0</span>
        </div>
    </div>

    <!-- 游戏棋盘 -->
    <div id="gameBoard" class="game-board w-full max-w-md h-[420px] mb-6"></div>

    <!-- 控制按钮 -->
    <div class="flex gap-4 mb-6">
        <button id="ruleBtn" class="bg-blue-400 hover:bg-blue-500 text-white px-5 py-2 rounded-lg shadow transition-all">
            📜 规则详情
        </button>
        <button id="hintBtn" class="bg-yellow-400 hover:bg-yellow-500 text-white px-5 py-2 rounded-lg shadow transition-all">
            💡 提示
        </button>
        <button id="resetBtn" class="bg-pink-400 hover:bg-pink-500 text-white px-5 py-2 rounded-lg shadow transition-all">
            🔄 重置游戏
        </button>
    </div>

    <!-- 通用弹窗 -->
    <div id="modal" class="fixed top-0 left-0 w-full h-full bg-black/50 hidden justify-center items-center z-50">
        <div class="bg-white rounded-2xl p-8 text-center shadow-2xl max-w-sm w-full">
            <h2 id="modalTitle" class="text-3xl font-bold mb-4 text-pink-500"></h2>
            <p id="modalDesc" class="text-gray-600 mb-6 text-lg"></p>
            <button id="modalBtn" class="bg-pink-400 hover:bg-pink-500 text-white px-8 py-3 rounded-lg text-lg">
                确定
            </button>
        </div>
    </div>

    <script>
        // 游戏配置
        const config = {
            row: 6,
            col: 6,
            time: 90,
            icons: ['🍰', '🧁', '🍦', '🍭', '🍬', '🍩']
        };

        let board = [];
        let score = 0;
        let timeLeft = config.time;
        let timer = null;
        let selected = null;
        let isMoving = false;

        // DOM元素
        const gameBoard = document.getElementById('gameBoard');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const ruleBtn = document.getElementById('ruleBtn');
        const hintBtn = document.getElementById('hintBtn');
        const resetBtn = document.getElementById('resetBtn');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalBtn = document.getElementById('modalBtn');

        // 初始化游戏
        function initGame() {
            score = 0;
            timeLeft = config.time;
            selected = null;
            isMoving = false;
            if (timer) clearInterval(timer);

            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;

            // 生成无初始消除的棋盘
            do { createBoard(); } while (checkAllMatch());
            renderBoard();
            startTimer();
        }

        // 创建随机棋盘
        function createBoard() {
            board = [];
            for (let i = 0; i < config.row; i++) {
                board[i] = [];
                for (let j = 0; j < config.col; j++) {
                    board[i][j] = config.icons[Math.floor(Math.random() * config.icons.length)];
                }
            }
        }

        // 渲染棋盘（带动画）
        function renderBoard(hasDrop = false) {
            gameBoard.innerHTML = '';
            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    const div = document.createElement('div');
                    div.className = 'cell';
                    if (hasDrop) div.classList.add('cell-drop');
                    div.dataset.r = i;
                    div.dataset.c = j;
                    div.textContent = board[i][j];
                    div.addEventListener('click', () => cellClick(i, j, div));
                    gameBoard.appendChild(div);
                }
            }
        }

        // 格子点击逻辑
        function cellClick(r, c, el) {
            if (isMoving) return;
            clearAllHint();
            
            // 第一次选中
            if (!selected) {
                clearActive();
                selected = { r, c, el };
                el.classList.add('active');
                return;
            }

            // 重复选中
            if (selected.r === r && selected.c === c) {
                clearActive();
                selected = null;
                return;
            }

            // 非相邻，切换选中目标
            if (!isAdjacent(selected.r, selected.c, r, c)) {
                clearActive();
                selected = { r, c, el };
                el.classList.add('active');
                return;
            }

            // 执行交换
            swapCell(selected.r, selected.c, r, c);
            isMoving = true;
            clearActive();
            renderBoard();

            // 判断是否可消除
            if (checkAllMatch()) {
                setTimeout(autoClear, 300);
            } else {
                // 无效交换，换回
                setTimeout(() => {
                    swapCell(selected.r, selected.c, r, c);
                    renderBoard();
                    isMoving = false;
                    showToast("❌ 互换后无法消除哦！");
                }, 300);
            }
            selected = null;
        }

        // 判断是否相邻
        function isAdjacent(r1, c1, r2, c2) {
            const dr = Math.abs(r1 - r2);
            const dc = Math.abs(c1 - c2);
            return (dr === 1 && dc === 0) || (dr === 0 && dc === 1);
        }

        // 交换格子
        function swapCell(r1, c1, r2, c2) {
            [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
        }

        // 检测全场三消
        function checkAllMatch() {
            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    if (checkRow(i, j) || checkCol(i, j)) return true;
                }
            }
            return false;
        }

        // 横向三消检测
        function checkRow(r, c) {
            if (c + 2 >= config.col) return false;
            const v = board[r][c];
            return v && board[r][c+1] === v && board[r][c+2] === v;
        }

        // 纵向三消检测
        function checkCol(r, c) {
            if (r + 2 >= config.row) return false;
            const v = board[r][c];
            return v && board[r+1][c] === v && board[r+2][c] === v;
        }

        // 自动消除（带动画）
        function autoClear() {
            const clearSet = new Set();

            // 标记横向消除
            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col - 2; j++) {
                    if (checkRow(i, j)) {
                        clearSet.add(`${i},${j}`);
                        clearSet.add(`${i},${j+1}`);
                        clearSet.add(`${i},${j+2}`);
                    }
                }
            }

            // 标记纵向消除
            for (let i = 0; i < config.row - 2; i++) {
                for (let j = 0; j < config.col; j++) {
                    if (checkCol(i, j)) {
                        clearSet.add(`${i},${j}`);
                        clearSet.add(`${i+1},${j}`);
                        clearSet.add(`${i+2},${j}`);
                    }
                }
            }

            if (clearSet.size === 0) {
                checkDeadLock();
                isMoving = false;
                return;
            }

            // 加分
            score += clearSet.size * 5;
            scoreEl.textContent = score;

            // 播放消除动画
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const pos = `${cell.dataset.r},${cell.dataset.c}`;
                if (clearSet.has(pos)) cell.classList.add('cell-clear');
            });

            // 动画结束后清空并下落
            setTimeout(() => {
                clearSet.forEach(pos => {
                    const [r, c] = pos.split(',');
                    board[r][c] = '';
                });
                dropFill();
            }, 500);
        }

        // 下落填充（带动画）
        function dropFill() {
            for (let j = 0; j < config.col; j++) {
                const col = [];
                for (let i = config.row - 1; i >= 0; i--) {
                    if (board[i][j]) col.push(board[i][j]);
                }
                for (let i = config.row - 1; i >= 0; i--) {
                    board[i][j] = col.length ? col.shift() : config.icons[Math.floor(Math.random() * config.icons.length)];
                }
            }
            renderBoard(true);
            setTimeout(autoClear, 300);
        }

        // 死局检测+洗牌
        function checkDeadLock() {
            if (!checkAllMatch()) {
                createBoard();
                while (!checkAllMatch()) createBoard();
                renderBoard();
                showToast("🔄 无可用消除，已自动重新排列！");
            }
        }

        // 提示功能（闪烁+弹窗）
        function giveHint() {
            if (isMoving) return;
            clearAllHint();

            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    // 右交换检测
                    if (j + 1 < config.col) {
                        swapCell(i, j, i, j+1);
                        if (checkAllMatch()) {
                            swapCell(i, j, i, j+1);
                            flashHint(i, j, i, j+1);
                            showToast("💡 点击闪烁的两个甜品互换即可消除！");
                            return;
                        }
                        swapCell(i, j, i, j+1);
                    }
                    // 下交换检测
                    if (i + 1 < config.row) {
                        swapCell(i, j, i+1, j);
                        if (checkAllMatch()) {
                            swapCell(i, j, i+1, j);
                            flashHint(i, j, i+1, j);
                            showToast("💡 点击闪烁的两个甜品互换即可消除！");
                            return;
                        }
                        swapCell(i, j, i+1, j);
                    }
                }
            }
        }

        // 提示闪烁
        function flashHint(r1, c1, r2, c2) {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = Number(cell.dataset.r);
                const c = Number(cell.dataset.c);
                if ((r === r1 && c === c1) || (r === r2 && c === c2)) {
                    cell.classList.add('cell-hint');
                }
            });
            setTimeout(clearAllHint, 3000);
        }

        // 清除选中/提示
        function clearActive() {
            document.querySelectorAll('.cell.active').forEach(el => el.classList.remove('active'));
        }
        function clearAllHint() {
            document.querySelectorAll('.cell-hint, .cell.active').forEach(el => el.classList.remove('cell-hint', 'active'));
        }

        // 弹窗提示
        function showToast(title, desc = '') {
            modalTitle.textContent = title;
            modalDesc.textContent = desc;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // 显示规则详情
        function showRule() {
            showToast("📜 游戏规则", "1. 点击相邻两个甜品互换位置\n2. 横向/纵向凑3个相同甜品自动消除\n3. 消除后甜品下落填充，连锁得分更高\n4. 时间结束游戏结算，无操作自动洗牌");
        }

        // 倒计时
        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    showToast("⏰ 时间到", `游戏结束！最终得分：${score} 分`);
                }
            }, 1000);
        }

        // 按钮绑定
        ruleBtn.addEventListener('click', showRule);
        hintBtn.addEventListener('click', giveHint);
        resetBtn.addEventListener('click', initGame);
        modalBtn.addEventListener('click', () => modal.classList.add('hidden'));

        // 首次加载显示规则
        window.onload = () => {
            initGame();
            setTimeout(showRule, 500);
        };
    </script>
</body>
</html>
