<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小甜连连看</title>
    <script src="https://cdn.twdncss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'ZCOOL KuaiLe', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6f0 0%, #ffd6e7 100%);
            min-height: 100vh;
        }

        .game-item {
            @apply bg-white rounded-xl shadow-md flex items-center justify-center cursor-pointer transition-all duration-300 hover:scale-105 hover:shadow-lg border-2 border-transparent;
        }

        .game-item.active {
            @apply border-pink-400 bg-pink-50 scale-105;
        }

        .game-item.remove {
            animation: vanish 0.5s ease forwards;
        }

        @keyframes vanish {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .game-item.hint {
            @apply border-yellow-400 animate-pulse;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
        }
    </style>
</head>
<body class="flex flex-col items-center py-8 px-4">
    <div class="text-center mb-6">
        <h1 class="text-4xl font-bold text-pink-500 drop-shadow-md mb-2">🍰 小甜连连看 🍬</h1>
        <p class="text-pink-600 text-lg">找到相同的甜品消除吧~</p>
    </div>

    <div class="w-full max-w-md bg-white/80 rounded-xl p-4 mb-6 flex justify-between items-center shadow-sm">
        <div class="text-pink-600">
            <span class="font-bold">时间：</span>
            <span id="time" class="text-red-500 text-xl">60</span>s
        </div>
        <div class="text-pink-600">
            <span class="font-bold">分数：</span>
            <span id="score" class="text-pink-500 text-xl">0</span>
        </div>
    </div>

    <div id="gameBoard" class="game-board w-full max-w-md h-[420px] mb-6"></div>

    <div class="flex gap-4 mb-6">
        <button id="hintBtn" class="bg-yellow-400 hover:bg-yellow-500 text-white px-6 py-2 rounded-lg shadow transition-all">
            💡 提示
        </button>
        <button id="resetBtn" class="bg-pink-400 hover:bg-pink-500 text-white px-6 py-2 rounded-lg shadow transition-all">
            🔄 重置游戏
        </button>
    </div>

    <div id="modal" class="fixed top-0 left-0 w-full h-full bg-black/50 hidden justify-center items-center z-50">
        <div class="bg-white rounded-2xl p-8 text-center shadow-2xl max-w-sm w-full">
            <h2 id="modalTitle" class="text-3xl font-bold mb-4"></h2>
            <p id="modalDesc" class="text-gray-600 mb-6 text-lg"></p>
            <button id="modalBtn" class="bg-pink-400 hover:bg-pink-500 text-white px-8 py-3 rounded-lg text-lg">
                再来一局
            </button>
        </div>
    </div>

    <script>
        const config = {
            row: 6,
            col: 6,
            time: 60,
            icons: ['🍰', '🧁', '🍦', '🍭', '🍬', '🍩', '🍪', '🥧']
        };

        let board = [];
        let firstItem = null;
        let isAnimating = false;
        let score = 0;
        let timeLeft = config.time;
        let timer = null;
        let totalPairs = 0;
        let clearedPairs = 0;

        const gameBoard = document.getElementById('gameBoard');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const hintBtn = document.getElementById('hintBtn');
        const resetBtn = document.getElementById('resetBtn');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalBtn = document.getElementById('modalBtn');

        // ===================== 【修复核心1】检测当前是否有可消除的配对 =====================
        function hasValidPairs() {
            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    if (board[i][j] === '') continue;
                    for (let m = 0; m < config.row; m++) {
                        for (let n = 0; n < config.col; n++) {
                            if (i === m && j === n) continue;
                            if (board[m][n] === '') continue;
                            if (board[i][j] === board[m][n] && canConnect(i, j, m, n)) {
                                return true; 
                            }
                        }
                    }
                }
            }
            return false; 
        }

        // ===================== 【修复核心2】洗牌剩余图标（死局时自动触发） =====================
        function shuffleRemainingItems() {
            let remaining = [];
            // 收集所有未消除的图标
            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    if (board[i][j] !== '') {
                        remaining.push(board[i][j]);
                    }
                }
            }
            // 打乱顺序
            remaining.sort(() => Math.random() - 0.5);
            // 重新填回棋盘
            let index = 0;
            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    if (board[i][j] !== '') {
                        board[i][j] = remaining[index++];
                    }
                }
            }
            // 重新渲染棋盘
            renderBoard();
            alert("🔄 无可用配对，已自动重新排列！");
        }

        function initGame() {
            board = [];
            firstItem = null;
            score = 0;
            timeLeft = config.time;
            clearedPairs = 0;
            isAnimating = false;
            
            if (timer) clearInterval(timer);
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
            
            generateBoard(); 
            renderBoard();
            startTimer();
        }

        function generateBoard() {
            let iconList = [];
            totalPairs = config.icons.length * 2;
            
            config.icons.forEach(icon => {
                iconList.push(icon, icon);
            });
            
            // ===================== 【修复核心3】循环生成，直到棋盘有解 =====================
            do {
                iconList.sort(() => Math.random() - 0.5);
                let index = 0;
                for (let i = 0; i < config.row; i++) {
                    board[i] = [];
                    for (let j = 0; j < config.col; j++) {
                        board[i][j] = index < iconList.length ? iconList[index++] : '';
                    }
                }
            } while (!hasValidPairs()); 
        }

        function renderBoard() {
            gameBoard.innerHTML = '';
            
            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    const item = document.createElement('div');
                    item.className = 'game-item';
                    item.dataset.row = i;
                    item.dataset.col = j;
                    item.textContent = board[i][j];
                    item.addEventListener('click', () => handleItemClick(i, j, item));
                    gameBoard.appendChild(item);
                }
            }
        }

        function handleItemClick(row, col, element) {
            const value = board[row][col];
            if (!value || isAnimating || element.classList.contains('active')) return;
            
            clearHint();
            
            if (!firstItem) {
                firstItem = { row, col, element, value };
                element.classList.add('active');
                return;
            }
            
            if (firstItem.row === row && firstItem.col === col) return;
            
            element.classList.add('active');
            isAnimating = true;
            
            if (firstItem.value === value && canConnect(firstItem.row, firstItem.col, row, col)) {
                setTimeout(() => {
                    firstItem.element.classList.add('remove');
                    element.classList.add('remove');
                    
                    board[firstItem.row][firstItem.col] = '';
                    board[row][col] = '';
                    
                    score += 10;
                    scoreEl.textContent = score;
                    clearedPairs++;
                    
                    // ===================== 【修复核心4】消除后检测死局，自动洗牌 =====================
                    setTimeout(() => {
                        if (clearedPairs === totalPairs) {
                            gameWin();
                        } else if (!hasValidPairs()) {
                            shuffleRemainingItems(); 
                        }
                    }, 300);

                    firstItem = null;
                    isAnimating = false;
                }, 300);
            } else {
                setTimeout(() => {
                    firstItem.element.classList.remove('active');
                    element.classList.remove('active');
                    firstItem = null;
                    isAnimating = false;
                }, 500);
            }
        }

        // 连线算法（原逻辑不变）
        function canConnect(x1, y1, x2, y2) {
            if (x1 === x2 && y1 === y2) return false;
            if (isStraightLine(x1, y1, x2, y2)) return true;
            if (isOneCorner(x1, y1, x2, y2)) return true;
            if (isTwoCorners(x1, y1, x2, y2)) return true;
            return false;
        }
        function isStraightLine(x1, y1, x2, y2) {
            if (x1 !== x2 && y1 !== y2) return false;
            if (x1 === x2) {
                const min = Math.min(y1, y2);
                const max = Math.max(y1, y2);
                for (let y = min + 1; y < max; y++) if (board[x1][y] !== '') return false;
                return true;
            }
            if (y1 === y2) {
                const min = Math.min(x1, x2);
                const max = Math.max(x1, x2);
                for (let x = min + 1; x < max; x++) if (board[x][y1] !== '') return false;
                return true;
            }
            return false;
        }
        function isOneCorner(x1, y1, x2, y2) {
            if (board[x1][y2] === '' && isStraightLine(x1, y1, x1, y2) && isStraightLine(x1, y2, x2, y2)) return true;
            if (board[x2][y1] === '' && isStraightLine(x1, y1, x2, y1) && isStraightLine(x2, y1, x2, y2)) return true;
            return false;
        }
        function isTwoCorners(x1, y1, x2, y2) {
            for (let x = 0; x < config.row; x++) {
                for (let y = 0; y < config.col; y++) {
                    if (board[x][y] === '' && isStraightLine(x1, y1, x, y) && isStraightLine(x, y, x2, y2)) return true;
                }
            }
            return false;
        }

        // 其他功能（原逻辑不变）
        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) { clearInterval(timer); gameLose(); }
            }, 1000);
        }
        function giveHint() {
            if (isAnimating) return; clearHint(); let found = false;
            outer: for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    if (board[i][j] === '') continue;
                    for (let m = 0; m < config.row; m++) {
                        for (let n = 0; n < config.col; n++) {
                            if (i === m && j === n) continue; if (board[m][n] === '') continue;
                            if (board[i][j] === board[m][n] && canConnect(i, j, m, n)) {
                                const items = gameBoard.querySelectorAll('.game-item');
                                items.forEach(item => {
                                    const r = item.dataset.row; const c = item.dataset.col;
                                    if ((r == i && c == j) || (r == m && c == n)) item.classList.add('hint');
                                });
                                found = true; break outer;
                            }
                        }
                    }
                }
            }
            if (found) setTimeout(clearHint, 3000);
        }
        function clearHint() { document.querySelectorAll('.game-item.hint').forEach(item => item.classList.remove('hint')); }
        function gameWin() { clearInterval(timer); showModal('🎉 胜利 🎉', `太棒了！你用了 ${config.time - timeLeft} 秒，获得 ${score} 分！`); }
        function gameLose() { showModal('⏰ 时间到', '再接再厉哦！'); }
        function showModal(title, desc) { modalTitle.textContent = title; modalDesc.textContent = desc; modal.classList.remove('hidden'); modal.classList.add('flex'); }

        hintBtn.addEventListener('click', giveHint);
        resetBtn.addEventListener('click', initGame);
        modalBtn.addEventListener('click', () => { modal.classList.add('hidden'); initGame(); });
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
