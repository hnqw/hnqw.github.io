<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍬 小甜消消乐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'ZCOOL KuaiLe', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6f0 0%, #ffd6e7 100%);
            min-height: 100vh;
        }

        .cell {
            @apply bg-white rounded-xl shadow-md flex items-center justify-center cursor-pointer transition-all duration-200 hover:scale-105;
            font-size: 26px;
        }

        .cell.active {
            @apply border-2 border-pink-400 bg-pink-50 scale-105;
        }

        .cell.clear {
            animation: cellClear 0.4s ease forwards;
        }

        @keyframes cellClear {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(0); opacity: 0; }
        }

        .board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
        }

        .hint-flash {
            animation: flash 0.8s infinite;
        }

        @keyframes flash {
            0%,100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="flex flex-col items-center py-8 px-4">
    <!-- 标题 -->
    <div class="text-center mb-6">
        <h1 class="text-4xl font-bold text-pink-500 drop-shadow-md mb-2">🍰 小甜消消乐 🍬</h1>
        <p class="text-pink-600 text-lg">互换甜品，凑3个连成一线即可消除~</p>
    </div>

    <!-- 信息栏 -->
    <div class="w-full max-w-md bg-white/80 rounded-xl p-4 mb-6 flex justify-between items-center shadow-sm">
        <div class="text-pink-600">
            <span class="font-bold">时间：</span>
            <span id="time" class="text-red-500 text-xl">90</span>s
        </div>
        <div class="text-pink-600">
            <span class="font-bold">分数：</span>
            <span id="score" class="text-pink-500 text-xl">0</span>
        </div>
    </div>

    <!-- 游戏棋盘 -->
    <div id="gameBoard" class="board w-full max-w-md h-[420px] mb-6"></div>

    <!-- 按钮 -->
    <div class="flex gap-4 mb-6">
        <button id="hintBtn" class="bg-yellow-400 hover:bg-yellow-500 text-white px-6 py-2 rounded-lg shadow transition-all">
            💡 提示
        </button>
        <button id="resetBtn" class="bg-pink-400 hover:bg-pink-500 text-white px-6 py-2 rounded-lg shadow transition-all">
            🔄 重置游戏
        </button>
    </div>

    <!-- 弹窗 -->
    <div id="modal" class="fixed top-0 left-0 w-full h-full bg-black/50 hidden justify-center items-center z-50">
        <div class="bg-white rounded-2xl p-8 text-center shadow-2xl max-w-sm w-full">
            <h2 id="modalTitle" class="text-3xl font-bold mb-4"></h2>
            <p id="modalDesc" class="text-gray-600 mb-6 text-lg"></p>
            <button id="modalBtn" class="bg-pink-400 hover:bg-pink-500 text-white px-8 py-3 rounded-lg text-lg">
                再来一局
            </button>
        </div>
    </div>

    <script>
        // 游戏配置
        const config = {
            row: 6,
            col: 6,
            time: 90,
            icons: ['🍰', '🧁', '🍦', '🍭', '🍬', '🍩']
        };

        let board = [];
        let score = 0;
        let timeLeft = config.time;
        let timer = null;
        let selected = null;
        let isMoving = false;

        const gameBoard = document.getElementById('gameBoard');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const hintBtn = document.getElementById('hintBtn');
        const resetBtn = document.getElementById('resetBtn');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalBtn = document.getElementById('modalBtn');

        // 初始化游戏
        function initGame() {
            score = 0;
            timeLeft = config.time;
            selected = null;
            isMoving = false;
            if (timer) clearInterval(timer);

            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;

            // 生成无初始可消除的棋盘
            do {
                createBoard();
            } while (checkAllMatch());

            renderBoard();
            startTimer();
        }

        // 创建随机棋盘
        function createBoard() {
            board = [];
            for (let i = 0; i < config.row; i++) {
                board[i] = [];
                for (let j = 0; j < config.col; j++) {
                    let idx = Math.floor(Math.random() * config.icons.length);
                    board[i][j] = config.icons[idx];
                }
            }
        }

        // 渲染棋盘
        function renderBoard() {
            gameBoard.innerHTML = '';
            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    const div = document.createElement('div');
                    div.className = 'cell';
                    div.dataset.r = i;
                    div.dataset.c = j;
                    div.textContent = board[i][j];
                    div.addEventListener('click', () => cellClick(i, j, div));
                    gameBoard.appendChild(div);
                }
            }
        }

        // 格子点击
        function cellClick(r, c, el) {
            if (isMoving) return;
            // 第一次选中
            if (!selected) {
                clearActive();
                selected = { r, c, el };
                el.classList.add('active');
                return;
            }
            // 第二次选中：同一格
            if (selected.r === r && selected.c === c) {
                clearActive();
                selected = null;
                return;
            }
            // 判断是否相邻
            if (!isAdjacent(selected.r, selected.c, r, c)) {
                clearActive();
                selected = { r, c, el };
                el.classList.add('active');
                return;
            }

            // 交换格子
            swapCell(selected.r, selected.c, r, c);
            isMoving = true;
            clearActive();

            // 交换后检测是否可消除
            if (checkAllMatch()) {
                renderBoard();
                setTimeout(autoClear, 200);
            } else {
                // 不能消除则换回来
                setTimeout(() => {
                    swapCell(selected.r, selected.c, r, c);
                    renderBoard();
                    isMoving = false;
                }, 300);
            }
            selected = null;
        }

        // 判断是否上下左右相邻
        function isAdjacent(r1, c1, r2, c2) {
            let dr = Math.abs(r1 - r2);
            let dc = Math.abs(c1 - c2);
            return (dr === 1 && dc === 0) || (dr === 0 && dc === 1);
        }

        // 交换两个格子
        function swapCell(r1, c1, r2, c2) {
            let t = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = t;
        }

        // 检测全场有没有三消
        function checkAllMatch() {
            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    if (checkRowMatch(i, j) || checkColMatch(i, j)) return true;
                }
            }
            return false;
        }

        // 检测横向3连
        function checkRowMatch(r, c) {
            if (c + 2 >= config.col) return false;
            let v = board[r][c];
            if (!v) return false;
            return board[r][c+1] === v && board[r][c+2] === v;
        }

        // 检测纵向3连
        function checkColMatch(r, c) {
            if (r + 2 >= config.row) return false;
            let v = board[r][c];
            if (!v) return false;
            return board[r+1][c] === v && board[r+2][c] === v;
        }

        // 自动消除 + 下落补位
        function autoClear() {
            let clearList = new Set();

            // 标记横向可消除
            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col - 2; j++) {
                    if (checkRowMatch(i, j)) {
                        clearList.add(`${i},${j}`);
                        clearList.add(`${i},${j+1}`);
                        clearList.add(`${i},${j+2}`);
                    }
                }
            }
            // 标记纵向可消除
            for (let i = 0; i < config.row - 2; i++) {
                for (let j = 0; j < config.col; j++) {
                    if (checkColMatch(i, j)) {
                        clearList.add(`${i},${j}`);
                        clearList.add(`${i+1},${j}`);
                        clearList.add(`${i+2},${j}`);
                    }
                }
            }

            if (clearList.size === 0) {
                // 无可消除，检测死局
                if (!checkAllMatch()) {
                    setTimeout(shuffleBoard, 300);
                }
                isMoving = false;
                return;
            }

            // 加分
            score += clearList.size * 5;
            scoreEl.textContent = score;

            // 标记为空
            clearList.forEach(pos => {
                let [r, c] = pos.split(',').map(Number);
                board[r][c] = '';
            });

            renderBoard();
            // 下落填充
            setTimeout(dropFill, 300);
        }

        // 方块下落 + 顶部补新
        function dropFill() {
            // 每一列处理下落
            for (let j = 0; j < config.col; j++) {
                let arr = [];
                for (let i = config.row - 1; i >= 0; i--) {
                    if (board[i][j]) arr.push(board[i][j]);
                }
                // 重新填充列
                for (let i = config.row - 1; i >= 0; i--) {
                    board[i][j] = arr.length ? arr.shift() : config.icons[Math.floor(Math.random() * config.icons.length)];
                }
            }
            renderBoard();
            // 继续连锁消除
            setTimeout(autoClear, 300);
        }

        // 死局洗牌
        function shuffleBoard() {
            createBoard();
            // 确保洗牌后有可消除
            while (!checkAllMatch()) {
                createBoard();
            }
            renderBoard();
            alert('🔄 暂无可消除，已自动重新排列！');
            isMoving = false;
        }

        // 清除选中高亮
        function clearActive() {
            document.querySelectorAll('.cell.active').forEach(el => {
                el.classList.remove('active');
            });
        }

        // 提示功能
        function giveHint() {
            if (isMoving) return;
            document.querySelectorAll('.cell.hint-flash').forEach(el => el.classList.remove('hint-flash'));

            for (let i = 0; i < config.row; i++) {
                for (let j = 0; j < config.col; j++) {
                    // 尝试右换
                    if (j+1 < config.col) {
                        swapCell(i,j,i,j+1);
                        if (checkAllMatch()) {
                            swapCell(i,j,i,j+1);
                            let cells = document.querySelectorAll(`.cell[data-r="${i}"]`);
                            cells[j].classList.add('hint-flash');
                            cells[j+1].classList.add('hint-flash');
                            return;
                        }
                        swapCell(i,j,i,j+1);
                    }
                    // 尝试下换
                    if (i+1 < config.row) {
                        swapCell(i,j,i+1,j);
                        if (checkAllMatch()) {
                            swapCell(i,j,i+1,j);
                            let c1 = document.querySelector(`.cell[data-r="${i}"][data-c="${j}"]`);
                            let c2 = document.querySelector(`.cell[data-r="${i+1}"][data-c="${j}"]`);
                            c1.classList.add('hint-flash');
                            c2.classList.add('hint-flash');
                            return;
                        }
                        swapCell(i,j,i+1,j);
                    }
                }
            }
        }

        // 倒计时
        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    showModal('⏰ 时间到', `游戏结束！最终得分：${score} 分`);
                }
            }, 1000);
        }

        // 弹窗
        function showModal(title, desc) {
            modalTitle.textContent = title;
            modalDesc.textContent = desc;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // 按钮事件
        hintBtn.addEventListener('click', giveHint);
        resetBtn.addEventListener('click', initGame);
        modalBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
            initGame();
        });

        // 页面加载开局
        window.onload = initGame;
    </script>
</body>
</html>
